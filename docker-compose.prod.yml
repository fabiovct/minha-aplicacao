services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile.prod
    container_name: laravel_app_prod
    restart: always
    working_dir: /var/www
    # Em prod, não usamos volumes para o código, ele vai no Dockerfile
    depends_on:
      - mysql
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Apenas o arquivo de config e os certificados SSL (quando você tiver)
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt # Para o SSL futuramente
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # Variável vinda do seu .env
      MYSQL_DATABASE: ${DB_DATABASE}
    # SEM PORTAS EXPOSTAS (3306) POR SEGURANÇA
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data: