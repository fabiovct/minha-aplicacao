# Redirecionamento de HTTP (80) para HTTPS (443)
server {
    listen 80;
    server_name suaapi.com; # <--- COLOQUE SEU DOMÍNIO AQUI
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name suaapi.com; # <--- COLOQUE SEU DOMÍNIO AQUI

    # Configuração do SSL (Caminhos padrões do Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/suaapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suaapi.com/privkey.pem;

    root /var/www/public;
    index index.php index.html;

    # 1. SEGURANÇA: Cabeçalhos para evitar ataques comuns
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. PERFORMANCE: Cache de arquivos estáticos (Imagens, JS, CSS)
    # Isso evita que o Nginx peça ao PHP para processar arquivos simples
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Otimizações de buffer para evitar erros 502 em respostas grandes
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.ht {
        deny all;
    }

    # Logs de acesso e erro (Importante para monitorar em produção)
    access_log /var/log/nginx/api_access.log;
    error_log  /var/log/nginx/api_error.log error;
}