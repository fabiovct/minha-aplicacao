apiVersion: v1
kind: Service
metadata:
  name: mysql-service # Esse será o seu DB_HOST no .env do Laravel
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - image: mysql:8.0
        name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "laravelk"
        - name: MYSQL_DATABASE
          value: "laravelk"